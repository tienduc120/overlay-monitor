# Protected. The same `cargo xtask verify --full` the pre-push hook runs, so a bypassed hook still meets the gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: windows-latest
    # bash keeps the commit-message loop and the clean-worktree check unchanged (ADR-0015).
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # rustup reads rust-toolchain.toml, so CI builds with exactly the pinned toolchain.
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The versions `cargo xtask doctor` pins.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-shear@1.14.0,typos@1.52.2

      # Format, layer rules, manifest policy, source rules, strict clippy, tests, spelling, cargo-deny, unused
      # dependencies, docs, and the proof that every rule fires on its fixture.
      - name: Verify
        run: cargo xtask verify --full

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "$sha" > "${RUNNER_TEMP}/msg"
            cargo xtask commitmsg "${RUNNER_TEMP}/msg" --commit "$sha"
          done

      # A gate that rewrites a file (a stale Cargo.lock, say) must fail here, not pass with a dirty tree.
      - name: Clean worktree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@1.32.0
      - name: Audit the workflows
        run: zizmor --persona=regular .github/workflows
