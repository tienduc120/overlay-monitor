# Clippy configuration for the whole workspace. Protected: never loosen a rule to make a change pass.
# A site that really needs a banned call says so with #[expect(clippy::disallowed_methods, reason = "...")], which the
# debt scan counts.

# Size limits. A function past them is doing more than one thing.
too-many-lines-threshold = 80
cognitive-complexity-threshold = 15
excessive-nesting-threshold = 4
too-many-arguments-threshold = 6
max-fn-params-bools = 1

# Tests may panic: a failed unwrap there is a failed test with a stack trace, which is what a test should do.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-methods = [
  # A detached thread outlives its caller and its panic is lost.
  { path = "std::thread::spawn", reason = "a detached thread outlives its caller; use std::thread::scope" },
  { path = "std::thread::Builder::spawn", reason = "a detached thread outlives its caller; use std::thread::scope" },

  # Waiting on nothing hides a race.
  { path = "std::thread::sleep", reason = "wait on a timer, a channel, or an event" },

  # Time comes from the caller.
  { path = "std::time::SystemTime::now", reason = "read time through the platform_clock::Clock port" },
  { path = "jiff::Timestamp::now", reason = "read time through the platform_clock::Clock port" },
  { path = "jiff::Zoned::now", reason = "read time through the platform_clock::Clock port" },

  # Process-wide state is set once, in the composition root.
  { path = "std::process::exit", reason = "return an ExitCode from main so destructors run and logs flush" },
  { path = "std::env::var", reason = "configuration is read once, in the composition root, and passed down as values" },
  { path = "std::env::var_os", reason = "configuration is read once, in the composition root, and passed down as values" },
  { path = "std::env::vars", reason = "configuration is read once, in the composition root, and passed down as values" },
  { path = "tracing::subscriber::set_global_default", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::util::SubscriberInitExt::init", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::util::SubscriberInitExt::try_init", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::fmt::SubscriberBuilder::init", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::fmt::SubscriberBuilder::try_init", reason = "only a composition root installs the global subscriber" },
]

disallowed-macros = [
  { path = "lazy_static::lazy_static", reason = "use std::sync::LazyLock" },
]
