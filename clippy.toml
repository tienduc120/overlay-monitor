# Clippy configuration for the whole workspace. Protected: never loosen a rule to make a change pass.
# A site that really needs a banned call says so with #[expect(clippy::disallowed_methods, reason = "...")], which the
# debt scan counts.

# Size limits. A function past them is doing more than one thing.
too-many-lines-threshold = 80
cognitive-complexity-threshold = 15
excessive-nesting-threshold = 4
too-many-arguments-threshold = 6
max-fn-params-bools = 1

# Tests may panic: a failed unwrap there is a failed test with a stack trace, which is what a test should do.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# A lock guard held across an await stalls every task waiting for it.
await-holding-invalid-types = [
  { path = "tokio::sync::MutexGuard", reason = "release the lock before awaiting; copy out what you need" },
  { path = "tokio::sync::RwLockReadGuard", reason = "release the lock before awaiting; copy out what you need" },
  { path = "tokio::sync::RwLockWriteGuard", reason = "release the lock before awaiting; copy out what you need" },
]

disallowed-methods = [
  # Concurrency is supervised: a task nobody awaits is a leak, and its panic is lost.
  { path = "tokio::spawn", reason = "run concurrent work through platform_task, which cancels, awaits, and reports panics" },
  { path = "tokio::task::spawn", reason = "run concurrent work through platform_task, which cancels, awaits, and reports panics" },
  { path = "tokio::task::spawn_blocking", reason = "run blocking work through platform_task (add a supervised helper there)" },
  { path = "tokio::task::spawn_local", reason = "run concurrent work through platform_task, which cancels, awaits, and reports panics" },
  { path = "tokio::task::JoinSet::spawn", reason = "run concurrent work through platform_task, which cancels, awaits, and reports panics" },
  { path = "tokio::runtime::Handle::spawn", reason = "run concurrent work through platform_task, which cancels, awaits, and reports panics" },
  { path = "tokio::runtime::Runtime::spawn", reason = "run concurrent work through platform_task, which cancels, awaits, and reports panics" },
  { path = "std::thread::spawn", reason = "a detached thread outlives its caller; use std::thread::scope, or platform_task in async code" },
  { path = "std::thread::Builder::spawn", reason = "a detached thread outlives its caller; use std::thread::scope, or platform_task in async code" },

  # Waiting on nothing hides a race; tests that need time use tokio::time::pause.
  { path = "std::thread::sleep", reason = "wait on a timer, a channel, or a cancellation token; tests use tokio::time::pause" },

  # Time and cancellation come from the caller.
  { path = "std::time::SystemTime::now", reason = "read time through the platform_clock::Clock port" },
  { path = "jiff::Timestamp::now", reason = "read time through the platform_clock::Clock port" },
  { path = "jiff::Zoned::now", reason = "read time through the platform_clock::Clock port" },
  { path = "tokio_util::sync::CancellationToken::new", reason = "derive from the caller's token with child_token(); only a composition root makes a root token" },

  # Process-wide state is set once, in the composition root.
  { path = "std::process::exit", reason = "return an ExitCode from main so destructors run and logs flush" },
  { path = "std::env::var", reason = "configuration is read once, in the composition root, and passed down as values" },
  { path = "std::env::var_os", reason = "configuration is read once, in the composition root, and passed down as values" },
  { path = "std::env::vars", reason = "configuration is read once, in the composition root, and passed down as values" },
  { path = "tracing::subscriber::set_global_default", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::util::SubscriberInitExt::init", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::util::SubscriberInitExt::try_init", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::fmt::SubscriberBuilder::init", reason = "only a composition root installs the global subscriber" },
  { path = "tracing_subscriber::fmt::SubscriberBuilder::try_init", reason = "only a composition root installs the global subscriber" },

  # A server with no timeouts is held open by the slowest client.
  { path = "axum::serve", reason = "serve through platform_http::Server, which requires every timeout" },
]

disallowed-macros = [
  { path = "lazy_static::lazy_static", reason = "use std::sync::LazyLock" },
]
