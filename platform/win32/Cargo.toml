[package]
name = "platform-win32"
description = "Safe wrappers over Win32 calls; the only crate that may use unsafe (ADR-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true, features = ["std"] }
windows = { workspace = true, features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# A window that presents frames, for other crates' ETW tests; only ever a dev-dependency feature.
test-support = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
]

[lints]
workspace = true
