[package]
name = "platform-http"
description = "The one way a service serves HTTP: every limit required, graceful shutdown with a deadline (ADR-0009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "time", "macros"] }
tokio-util = { workspace = true }
tower-http = { workspace = true, features = ["timeout", "limit", "catch-panic"] }

[dev-dependencies]
platform-task = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "macros", "rt", "io-util"] }

[lints]
workspace = true
