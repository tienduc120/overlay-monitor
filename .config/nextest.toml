# Test runner limits. Protected: a hang must end with a named test, not a stuck session.
[profile.default]
# A test that runs 30s is reported as slow; one that runs past two minutes is killed and fails.
slow-timeout = { period = "30s", terminate-after = 4 }
# A test that leaves a child process holding its output fails instead of hanging the run.
leak-timeout = { period = "500ms", result = "fail" }
fail-fast = false

[profile.ci]
failure-output = "immediate-final"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
